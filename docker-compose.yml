# Local Elasticsearch + Kibana for the "elastic" logging provider (logging-config.json).
# The framework uses Elastic's 8.x .NET client, so this must be Elasticsearch 8.x (OpenSearch is not compatible).
#
#   docker compose up -d     # Elasticsearch on http://localhost:9200, Kibana on http://localhost:5601
#   docker compose down      # add -v to delete the stored data
#
# Security is disabled: this stack is for local development only, so no username or password is needed.
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: tafw-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - es-data:/usr/share/elasticsearch/data
    ports:
      - 9200:9200
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    container_name: tafw-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - 5601:5601
    depends_on:
      elasticsearch:
        condition: service_healthy

volumes:
  es-data:
