trigger:
  branches:
    include:
      - main
      - release/*
      - add-elastic-logging

pr:
  branches:
    include:
      - main

variables:
  buildConfiguration: "Release"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

stages:
  - stage: BuildAndValidate
    displayName: "PR Validation and Quality Gate"
    jobs:
      # -------------------------------------------------------------
      # Job 1: Linux Agent for Web and API Suites
      # -------------------------------------------------------------
      - job: WebAndApiAutomation
        displayName: "API and Playwright Web Suites (Linux)"
        pool:
          vmImage: "ubuntu-latest"
        timeoutInMinutes: 15
        steps:
          - task: UseDotNet@2
            displayName: "Setup .NET SDK 10.x"
            inputs:
              packageType: "sdk"
              version: "10.x"
              installationPath: $(Agent.ToolsDirectory)/dotnet

          - script: dotnet restore modern-test-framework.sln
            displayName: "Restore Solution Dependencies"

          - script: dotnet build modern-test-framework.sln --configuration $(buildConfiguration) --no-restore
            displayName: "Compile Solution (Release)"

          # Install Chromium directly using the generated build script in the test folder
          - script: pwsh tests/Automation.Tests/bin/$(buildConfiguration)/net10.0/playwright.ps1 install --with-deps chromium
            displayName: "Provision Playwright Browsers"
            timeoutInMinutes: 5

          # Run API Tests (NUnit)
          - script: dotnet test API/API.Tests.csproj --configuration $(buildConfiguration) --no-build --logger "trx;LogFileName=api_results.trx" --collect "XPlat Code Coverage"
            displayName: "Run API Test Suite"
            env:
              ENVIRONMENT: "CI"

          # Run Web / Playwright Tests (xUnit)
          - script: dotnet test tests/Automation.Tests/Automation.Tests.csproj --configuration $(buildConfiguration) --no-build --logger "trx;LogFileName=web_results.trx" --collect "XPlat Code Coverage"
            displayName: "Run Playwright Web Suite"
            env:
              HEADLESS: "true"
              ENVIRONMENT: "CI"

          - task: PublishTestResults@2
            displayName: "Publish VSTest Run Metrics"
            condition: always()
            inputs:
              testResultsFormat: "VSTest"
              testResultsFiles: "**/*_results.trx"
              searchFolder: "$(Agent.BuildDirectory)"
              failTaskOnFailedTests: true

          - task: PublishCodeCoverageResults@2
            displayName: "Publish Code Coverage Quality Gate"
            condition: always()
            inputs:
              summaryFileLocation: "$(Agent.BuildDirectory)/**/coverage.cobertura.xml"

      # -------------------------------------------------------------
      # Job 2: Windows Agent for Desktop UI Automation (FlaUI / UIA)
      # -------------------------------------------------------------
      - job: DesktopAutomation
        displayName: "Desktop UI Tests (Windows)"
        pool:
          vmImage: "windows-latest"
        timeoutInMinutes: 15
        steps:
          - task: UseDotNet@2
            displayName: "Setup .NET SDK 10.x"
            inputs:
              packageType: "sdk"
              version: "10.x"

          - script: dotnet restore UI/Desktop/UI.Desktop.Tests/UI.Desktop.Tests.csproj
            displayName: "Restore Desktop Dependencies"

          - script: dotnet build UI/Desktop/UI.Desktop.Tests/UI.Desktop.Tests.csproj --configuration $(buildConfiguration) --no-restore
            displayName: "Compile Desktop Suite"

          - task: PublishTestResults@2
            displayName: "Publish Desktop Test Metrics"
            condition: always()
            inputs:
              testResultsFormat: "VSTest"
              testResultsFiles: "**/desktop_results.trx"
              searchFolder: "$(Agent.BuildDirectory)"
              failTaskOnFailedTests: false
