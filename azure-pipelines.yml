# =============================================================================
# CI/CD for the test automation framework.
#
# Source code lives on GitHub (ravs788/complete-test-automation-fmw).
# This pipeline is connected to that repo through the Azure Pipelines GitHub app,
# so pushes and PRs on GitHub trigger it and results appear as GitHub checks.
#
# Web UI and API tests live in Tests/ (pages in Pages/, shared code in Core/); they run on the drivers selected in
# providers.json (Playwright for the browser and, by default, for HTTP), with UI driver contract checks in Tests/Contract:
#
#   PR into main      -> API + TodoMVC (all), SauceDemo (smoke), Chrome
#   Push to main /    -> everything, Chrome, plus code coverage
#   release/*
#   Nightly (02:00    -> everything on Chrome, plus the web UI tests again on Playwright's
#   UTC, main, only      Chromium, Firefox and WebKit
#   if it changed)     + Android mobile smoke on hosted macOS
#   Manual           -> Linux tests + Android mobile smoke + Windows helper verification
#
# Web/API and framework tests share one Linux job. A separate hosted macOS job runs
# Android smoke tests for scheduled/manual builds; a Windows job verifies the batch helper.
# With one parallel slot these jobs queue.
# CI builds all projects through ci.slnf; the macOS job builds its own mobile dependency tree.
#
# Tests use xUnit + Allure.Xunit. Every run publishes two artifacts:
#   allure-report  : the HTML report (allure-report.html is a single file you can open directly)
#                    with history/trends carried over from the latest main build's report
#   allure-results : the raw results (for `allure serve <dir>`)
# The mobile job publishes mobile-results separately, including TRX, raw Allure results,
# Appium/emulator/logcat logs. Its first hosted execution must pass before R16 can close.
# =============================================================================

trigger:
  branches:
    include:
      - main
      - release/*

pr:
  branches:
    include:
      - main

# Nightly cross-browser run (R13). always: false = skip the night if main didn't change.
schedules:
  - cron: "0 2 * * *"
    displayName: "Nightly: cross-browser web UI and Android smoke"
    branches:
      include:
        - main
    always: false

# Web/API diagnostics can be suppressed for suites exercising sensitive applications.
# Mobile diagnostics retain their existing policy while mobile work is explicitly deferred.
parameters:
  - name: diagnosticArtifactMode
    type: string
    default: standard
    values:
      - standard
      - restricted
  - name: publishWebDiagnostics
    type: boolean
    default: true

variables:
  buildConfiguration: "Release"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  isPullRequest: $[eq(variables['Build.Reason'], 'PullRequest')]
  isScheduled: $[eq(variables['Build.Reason'], 'Schedule')]
  # Allure CLI used to build the HTML report (npm package allure-commandline; needs Java, which the image has).
  allureVersion: "2.46.1"
  # Playwright drives the Google Chrome preinstalled on the hosted image
  # (read by ConfigurationProvider), so no Playwright browser download is needed.
  BROWSER: "chrome"
  ENVIRONMENT: "CI"
  # PR -> everything except the non-smoke SauceDemo tests, no coverage (faster)
  # main/release -> all tests + coverage
  ${{ if eq(variables['Build.Reason'], 'PullRequest') }}:
    testFilterArgs: '--filter "FullyQualifiedName!~.SauceDemo.|Category=smoke"'
    coverageArgs: ""
  ${{ else }}:
    testFilterArgs: ""
    coverageArgs: '--collect "XPlat Code Coverage"'

stages:
  - stage: BuildAndValidate
    displayName: "PR Validation and Quality Gate"
    jobs:
      - job: Tests
        variables:
          DIAGNOSTIC_ARTIFACTS: ${{ parameters.diagnosticArtifactMode }}
        displayName: "Playwright UI and API Tests (Linux)"
        pool:
          vmImage: "ubuntu-latest"
        timeoutInMinutes: 30
        steps:
          - checkout: self
            fetchDepth: 1

          - task: UseDotNet@2
            displayName: "Setup .NET SDK 10.x"
            inputs:
              packageType: "sdk"
              version: "10.x"

          # build restores implicitly; one call is faster than restore + build
          # Directory.Build.props treats warnings (incl. code style) as errors here, because TF_BUILD is set.
          - script: dotnet build ci.slnf --configuration $(buildConfiguration)
            displayName: "Build CI Projects (Release)"

          # Framework unit tests first: they take about a second and fail fast on a broken Core.
          - script: dotnet test Tests/Unit/Tests.Unit.csproj --configuration $(buildConfiguration) --no-build --logger "trx;LogFileName=unit_results.trx" $(coverageArgs)
            displayName: "Run Framework Unit Tests"

          # Each dotnet test run starts by clearing bin/.../allure-results (the Allure reporter's BeginRun, R39), so
          # every run copies its results to the staging folder straight away.
          - script: |
              dotnet test Tests/Tests.csproj --configuration $(buildConfiguration) --no-build $(testFilterArgs) --logger "trx;LogFileName=playwright_results.trx" $(coverageArgs)
              rc=$?
              mkdir -p "$(Build.ArtifactStagingDirectory)/allure-results"
              cp -R "Tests/bin/$(buildConfiguration)/net10.0/allure-results/." "$(Build.ArtifactStagingDirectory)/allure-results/" 2>/dev/null || true
              exit $rc
            displayName: "Run Playwright UI + API Tests"

          # Driver contract tests (R42, R46): the same behaviour checks against each UI driver adapter, on a local
          # data: page (no external site). Separate project without Allure, so they stay out of the app report.
          - script: dotnet test Tests/Contract/Tests.Contract.csproj --configuration $(buildConfiguration) --no-build --logger "trx;LogFileName=contract_results.trx"
            displayName: "Run UI Driver Contract Tests"
            condition: succeededOrFailed()

          # Nightly only: the web UI tests again on Playwright's own browsers (installed here).
          - script: pwsh Tests/bin/$(buildConfiguration)/net10.0/playwright.ps1 install --with-deps chromium firefox webkit
            displayName: "Install Playwright Browsers (nightly)"
            condition: and(succeededOrFailed(), eq(variables.isScheduled, true))

          - script: |
              rc=0
              mkdir -p "$(Build.ArtifactStagingDirectory)/allure-results"
              for b in chromium firefox webkit; do
                BROWSER=$b dotnet test Tests/Tests.csproj --configuration $(buildConfiguration) --no-build \
                  --filter "FullyQualifiedName!~Tests.Api." --logger "trx;LogFileName=web_${b}_results.trx" || rc=1
                cp -R "Tests/bin/$(buildConfiguration)/net10.0/allure-results/." "$(Build.ArtifactStagingDirectory)/allure-results/" 2>/dev/null || true
              done
              exit $rc
            displayName: "Run Web UI Tests on Chromium, Firefox, WebKit (nightly)"
            condition: and(succeededOrFailed(), eq(variables.isScheduled, true))

          - task: PublishTestResults@2
            displayName: "Publish Test Results"
            condition: and(always(), ${{ parameters.publishWebDiagnostics }})
            inputs:
              testResultsFormat: "VSTest"
              testResultsFiles: "**/*_results.trx"
              searchFolder: "$(System.DefaultWorkingDirectory)"
              testRunTitle: "Unit + Playwright UI + API"
              failTaskOnFailedTests: true

          - task: PublishCodeCoverageResults@2
            displayName: "Publish Code Coverage"
            condition: and(always(), eq(variables.isPullRequest, false), ${{ parameters.publishWebDiagnostics }})
            inputs:
              summaryFileLocation: "$(System.DefaultWorkingDirectory)/**/coverage.cobertura.xml"

          - script: |
              out="$(Build.ArtifactStagingDirectory)/allure-results"
              mkdir -p "$out"
              cp allure-categories.json "$out/categories.json"
              echo "Allure result files: $(ls "$out" | grep -c 'result.json')"
            displayName: "Collect Allure Results"
            condition: always()

          - task: PublishPipelineArtifact@1
            displayName: "Upload Allure Results"
            condition: and(always(), ${{ parameters.publishWebDiagnostics }})
            continueOnError: true
            inputs:
              targetPath: "$(Build.ArtifactStagingDirectory)/allure-results"
              artifact: "allure-results"

          # R14: HTML report with trends. Take history/ from the latest main build that has a report, then
          # generate the report and a single-file copy.
          - task: DownloadPipelineArtifact@2
            displayName: "Download Previous Allure History"
            condition: and(always(), ${{ parameters.publishWebDiagnostics }})
            continueOnError: true
            inputs:
              buildType: "specific"
              project: "$(System.TeamProjectId)"
              definition: "$(System.DefinitionId)"
              buildVersionToDownload: "latestFromBranch"
              # Always main: PRs and other branches have no earlier reports of their own, so they compare against main.
              branchName: "refs/heads/main"
              # A build with any warning is "partially succeeded"; without this it is never picked, and the search falls
              # back to an old build that has no report (R31).
              allowPartiallySucceededBuilds: true
              allowFailedBuilds: true
              artifactName: "allure-report"
              itemPattern: "history/**"
              targetPath: "$(Pipeline.Workspace)/allure-previous"

          - script: |
              results="$(Build.ArtifactStagingDirectory)/allure-results"
              report="$(Build.ArtifactStagingDirectory)/allure-report"
              single="$(Agent.TempDirectory)/allure-single"
              previous="$(Pipeline.Workspace)/allure-previous/history"
              if [ -d "$previous" ]; then cp -R "$previous" "$results/history"; echo "Using previous history"; fi
              npx --yes allure-commandline@$(allureVersion) generate "$results" -o "$report" --clean
              npx --yes allure-commandline@$(allureVersion) generate "$results" -o "$single" --single-file --clean
              cp "$single/index.html" "$report/allure-report.html"
            displayName: "Generate Allure Report"
            condition: and(always(), ${{ parameters.publishWebDiagnostics }})
            continueOnError: true

          - task: PublishPipelineArtifact@1
            displayName: "Upload Allure Report"
            condition: and(always(), ${{ parameters.publishWebDiagnostics }})
            continueOnError: true
            inputs:
              targetPath: "$(Build.ArtifactStagingDirectory)/allure-report"
              artifact: "allure-report"

      - job: MobileSmoke
        displayName: "Android 14 Chrome Smoke (macOS)"
        dependsOn: []
        condition: and(not(canceled()), in(variables['Build.Reason'], 'Schedule', 'Manual'))
        pool:
          vmImage: "macOS-15"
        # Worst case with every step at its own limit (boot 900 s, settle, Chrome warm-up, 300 s session) is about 35 min.
        timeoutInMinutes: 45
        cancelTimeoutInMinutes: 5
        variables:
          # UiAutomator2 4.x supports Appium 2; avoid installing an incompatible latest driver.
          appiumVersion: "2.19.0"
          uiautomator2Version: "4.2.9"
          mobileResults: "$(Build.ArtifactStagingDirectory)/mobile-results"
        steps:
          - checkout: self
            fetchDepth: 1

          - bash: mkdir -p "$(mobileResults)/logs" "$(mobileResults)/trx" "$(mobileResults)/allure-results"
            displayName: "Initialize Mobile Artifacts"

          - task: UseDotNet@2
            displayName: "Setup .NET SDK 10.x (mobile)"
            inputs:
              packageType: "sdk"
              version: "10.x"

          - task: UseNode@1
            displayName: "Setup Node.js (mobile)"
            inputs:
              version: "22.23.2"

          - bash: bash scripts/unix/run_mobile_ci.sh
            displayName: "Boot Android, Start Appium, Run Smoke Tests"
            env:
              BUILD_CONFIGURATION: $(buildConfiguration)
              APPIUM_VERSION: $(appiumVersion)
              UIAUTOMATOR2_VERSION: $(uiautomator2Version)
              MOBILE_CI_RESULTS: $(mobileResults)
              # Boot time on the 1-vCPU hosted emulator varies: 446-505 s in runs 115/118, over 600 s in run 127 (R32).
              BOOT_TIMEOUT_SECONDS: "900"

          - task: PublishTestResults@2
            displayName: "Publish Mobile Test Results"
            condition: always()
            inputs:
              testResultsFormat: "VSTest"
              testResultsFiles: "**/mobile_results.trx"
              searchFolder: "$(mobileResults)/trx"
              testRunTitle: "Android 14 Chrome Smoke"
              failTaskOnFailedTests: true
              failTaskOnMissingResultsFile: true

          - task: PublishPipelineArtifact@1
            displayName: "Upload Mobile Results and Diagnostics"
            condition: always()
            inputs:
              targetPath: "$(mobileResults)"
              artifact: "mobile-results"


      - job: WindowsHelperVerification
        displayName: "Verify Windows Build-Failure Handling"
        dependsOn: []
        condition: and(not(canceled()), in(variables['Build.Reason'], 'Schedule', 'Manual'))
        pool:
          vmImage: "windows-2025"
        timeoutInMinutes: 10
        steps:
          - checkout: self
            fetchDepth: 1

          - task: PowerShell@2
            displayName: "Verify Failed Build Never Starts Tests"
            inputs:
              targetType: "filePath"
              filePath: "scripts/windows/verify_build_failure.ps1"
              arguments: '-ResultsDirectory "$(Build.ArtifactStagingDirectory)/windows-helper-verification"'
              pwsh: false

          - task: PublishPipelineArtifact@1
            displayName: "Upload Windows Helper Verification"
            condition: always()
            inputs:
              targetPath: "$(Build.ArtifactStagingDirectory)/windows-helper-verification"
              artifact: "windows-helper-verification"
