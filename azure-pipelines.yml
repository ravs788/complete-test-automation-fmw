# =============================================================================
# CI/CD for the test automation framework.
#
# Source code lives on GitHub (ravs788/complete-test-automation-fmw).
# This pipeline is connected to that repo through the Azure Pipelines GitHub app,
# so pushes and PRs on GitHub trigger it and results appear as GitHub checks.
#
#   PR into main      -> API + Playwright (full), Selenium (smoke, Chrome)
#   Push to main /    -> API + Playwright (full), Selenium (regression, Chrome)
#   release/*
# =============================================================================

trigger:
  branches:
    include:
      - main
      - release/*

pr:
  branches:
    include:
      - main

variables:
  buildConfiguration: "Release"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  isPullRequest: $[eq(variables['Build.Reason'], 'PullRequest')]

stages:
  - stage: BuildAndValidate
    displayName: "PR Validation and Quality Gate"
    jobs:
      # -------------------------------------------------------------
      # Job 1: API (NUnit) + Playwright web (xUnit) on Linux
      # -------------------------------------------------------------
      - job: ApiAndPlaywright
        displayName: "API and Playwright Web Suites (Linux)"
        pool:
          vmImage: "ubuntu-latest"
        timeoutInMinutes: 15
        steps:
          - task: UseDotNet@2
            displayName: "Setup .NET SDK 10.x"
            inputs:
              packageType: "sdk"
              version: "10.x"
              installationPath: $(Agent.ToolsDirectory)/dotnet

          - script: dotnet restore TestAutomationPlatform.slnx
            displayName: "Restore Solution Dependencies"

          - script: dotnet build TestAutomationPlatform.slnx --configuration $(buildConfiguration) --no-restore
            displayName: "Compile Solution (Release)"

          # Run the installer directly from inside the build directory
          - script: |
              cd tests/Automation.Tests/bin/$(buildConfiguration)/net10.0
              pwsh ./playwright.ps1 install --with-deps chromium
            displayName: "Provision Playwright Browsers"
            timeoutInMinutes: 5

          - script: dotnet test API/API.Tests.csproj --configuration $(buildConfiguration) --no-build --logger "trx;LogFileName=api_results.trx" --collect "XPlat Code Coverage"
            displayName: "Run API Test Suite"
            env:
              ENVIRONMENT: "CI"

          - script: dotnet test tests/Automation.Tests/Automation.Tests.csproj --configuration $(buildConfiguration) --no-build --logger "trx;LogFileName=web_results.trx" --collect "XPlat Code Coverage"
            displayName: "Run Playwright Web Suite"
            condition: succeededOrFailed()
            env:
              ENVIRONMENT: "CI"

          - task: PublishTestResults@2
            displayName: "Publish API + Playwright Test Results"
            condition: always()
            inputs:
              testResultsFormat: "VSTest"
              testResultsFiles: "**/*_results.trx"
              searchFolder: "$(System.DefaultWorkingDirectory)"
              testRunTitle: "API + Playwright"
              failTaskOnFailedTests: true

          - task: PublishCodeCoverageResults@2
            displayName: "Publish Code Coverage"
            condition: always()
            inputs:
              summaryFileLocation: "$(System.DefaultWorkingDirectory)/**/coverage.cobertura.xml"

          - task: PublishPipelineArtifact@1
            displayName: "Upload API Allure Results"
            condition: always()
            continueOnError: true
            inputs:
              targetPath: "API/bin/$(buildConfiguration)/net10.0/allure-results"
              artifact: "allure-results-api"

      # -------------------------------------------------------------
      # Job 2: Selenium web (NUnit) on Linux
      #   PR   -> Category=smoke
      #   push -> Category=regression
      # CI runs the Chrome test cases only (Name~chrome); Firefox and Edge
      # cases still run locally (scripts/*/run_ui_web_all_browsers).
      # Selenium Manager downloads chromedriver. BaseWebTest forces headless
      # mode because Azure sets TF_BUILD=True.
      # -------------------------------------------------------------
      - job: SeleniumWeb
        displayName: "Selenium Web Suite (Linux)"
        pool:
          vmImage: "ubuntu-latest"
        timeoutInMinutes: 30
        steps:
          - task: UseDotNet@2
            displayName: "Setup .NET SDK 10.x"
            inputs:
              packageType: "sdk"
              version: "10.x"

          - script: dotnet build UI/Web/UI.Web.Tests.csproj --configuration $(buildConfiguration)
            displayName: "Compile Selenium Web Suite"

          - script: dotnet test UI/Web/UI.Web.Tests.csproj --configuration $(buildConfiguration) --no-build --filter "Category=smoke&Name~chrome" --logger "trx;LogFileName=selenium_smoke_results.trx"
            displayName: "Run Selenium Smoke (PR)"
            condition: and(succeeded(), eq(variables.isPullRequest, true))

          - script: dotnet test UI/Web/UI.Web.Tests.csproj --configuration $(buildConfiguration) --no-build --filter "Category=regression&Name~chrome" --logger "trx;LogFileName=selenium_regression_results.trx"
            displayName: "Run Selenium Regression (main / release)"
            condition: and(succeeded(), eq(variables.isPullRequest, false))

          - task: PublishTestResults@2
            displayName: "Publish Selenium Test Results"
            condition: always()
            inputs:
              testResultsFormat: "VSTest"
              testResultsFiles: "**/selenium_*_results.trx"
              searchFolder: "$(System.DefaultWorkingDirectory)"
              testRunTitle: "Selenium Web"
              failTaskOnFailedTests: true

          - task: PublishPipelineArtifact@1
            displayName: "Upload Selenium Allure Results"
            condition: always()
            continueOnError: true
            inputs:
              targetPath: "UI/Web/bin/$(buildConfiguration)/net10.0/allure-results"
              artifact: "allure-results-ui-web"
