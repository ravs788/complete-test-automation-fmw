# =============================================================================
# CI/CD for the test automation framework.
#
# Source code lives on GitHub (ravs788/complete-test-automation-fmw).
# This pipeline is connected to that repo through the Azure Pipelines GitHub app,
# so pushes and PRs on GitHub trigger it and results appear as GitHub checks.
#
# All UI and API tests are Playwright-based and live in Tests/ (pages in Pages/, shared code in Core/):
#
#   PR into main      -> API + TodoMVC (all), SauceDemo (smoke), Chrome
#   Push to main /    -> everything, Chrome, plus code coverage
#   release/*
#
# Everything runs in ONE job on purpose: the org has a single parallel job, so
# separate jobs ran back to back and each paid agent start-up, checkout, SDK
# setup and build again. CI builds only the projects it tests (ci.slnf).
#
# Tests use xUnit + Allure.Xunit; the results are published as the
# "allure-results" artifact (download it and run `allure serve <dir>`).
# The Appium mobile suite (Tests/UI/Mobile) needs an Android emulator and isn't run here.
# =============================================================================

trigger:
  branches:
    include:
      - main
      - release/*

pr:
  branches:
    include:
      - main

variables:
  buildConfiguration: "Release"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  isPullRequest: $[eq(variables['Build.Reason'], 'PullRequest')]
  # Playwright drives the Google Chrome preinstalled on the hosted image
  # (read by ConfigurationProvider), so no Playwright browser download is needed.
  BROWSER: "chrome"
  ENVIRONMENT: "CI"
  # PR -> everything except the non-smoke SauceDemo tests, no coverage (faster)
  # main/release -> all tests + coverage
  ${{ if eq(variables['Build.Reason'], 'PullRequest') }}:
    testFilterArgs: '--filter "FullyQualifiedName!~.SauceDemo.|Category=smoke"'
    coverageArgs: ""
  ${{ else }}:
    testFilterArgs: ""
    coverageArgs: '--collect "XPlat Code Coverage"'

stages:
  - stage: BuildAndValidate
    displayName: "PR Validation and Quality Gate"
    jobs:
      - job: Tests
        displayName: "Playwright UI and API Tests (Linux)"
        pool:
          vmImage: "ubuntu-latest"
        timeoutInMinutes: 30
        steps:
          - checkout: self
            fetchDepth: 1

          - task: UseDotNet@2
            displayName: "Setup .NET SDK 10.x"
            inputs:
              packageType: "sdk"
              version: "10.x"

          # build restores implicitly; one call is faster than restore + build
          # Directory.Build.props treats warnings (incl. code style) as errors here, because TF_BUILD is set.
          - script: dotnet build ci.slnf --configuration $(buildConfiguration)
            displayName: "Build CI Projects (Release)"

          # Framework unit tests first: they take about a second and fail fast on a broken Core.
          - script: dotnet test Tests/Unit/Tests.Unit.csproj --configuration $(buildConfiguration) --no-build --logger "trx;LogFileName=unit_results.trx" $(coverageArgs)
            displayName: "Run Framework Unit Tests"

          - script: dotnet test Tests/Tests.csproj --configuration $(buildConfiguration) --no-build $(testFilterArgs) --logger "trx;LogFileName=playwright_results.trx" $(coverageArgs)
            displayName: "Run Playwright UI + API Tests"

          - task: PublishTestResults@2
            displayName: "Publish Test Results"
            condition: always()
            inputs:
              testResultsFormat: "VSTest"
              testResultsFiles: "**/*_results.trx"
              searchFolder: "$(System.DefaultWorkingDirectory)"
              testRunTitle: "Unit + Playwright UI + API"
              failTaskOnFailedTests: true

          - task: PublishCodeCoverageResults@2
            displayName: "Publish Code Coverage"
            condition: and(always(), eq(variables.isPullRequest, false))
            inputs:
              summaryFileLocation: "$(System.DefaultWorkingDirectory)/**/coverage.cobertura.xml"

          - script: |
              out="$(Build.ArtifactStagingDirectory)/allure-results"
              mkdir -p "$out"
              src="Tests/bin/$(buildConfiguration)/net10.0/allure-results"
              [ -d "$src" ] && cp -R "$src"/. "$out"/
              cp allure-categories.json "$out/categories.json"
              echo "Allure result files: $(ls "$out" | grep -c 'result.json')"
            displayName: "Collect Allure Results"
            condition: always()

          - task: PublishPipelineArtifact@1
            displayName: "Upload Allure Results"
            condition: always()
            continueOnError: true
            inputs:
              targetPath: "$(Build.ArtifactStagingDirectory)/allure-results"
              artifact: "allure-results"
