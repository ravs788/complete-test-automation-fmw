# =============================================================================
# CI/CD for the test automation framework.
#
# Source code lives on GitHub (ravs788/complete-test-automation-fmw).
# This pipeline is connected to that repo through the Azure Pipelines GitHub app,
# so pushes and PRs on GitHub trigger it and results appear as GitHub checks.
#
#   PR into main      -> API + Playwright (full), Selenium (smoke, Chrome)
#   Push to main /    -> API + Playwright (full), Selenium (regression, Chrome),
#   release/*            plus code coverage
#
# Everything runs in ONE job on purpose: the org has a single parallel job, so
# separate jobs ran back to back and each paid agent start-up, checkout, SDK
# setup and build again. CI builds only the projects it tests (ci.slnf).
#
# All suites use xUnit + Allure.Xunit; their Allure results are merged into a
# single "allure-results" artifact (download it and run `allure serve <dir>`).
# =============================================================================

trigger:
  branches:
    include:
      - main
      - release/*

pr:
  branches:
    include:
      - main

variables:
  buildConfiguration: "Release"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  isPullRequest: $[eq(variables['Build.Reason'], 'PullRequest')]
  # Playwright drives the Google Chrome preinstalled on the hosted image,
  # so no Playwright browser download is needed.
  PLAYWRIGHT_CHANNEL: "chrome"
  ENVIRONMENT: "CI"
  # PR -> Selenium smoke, no coverage (faster); main/release -> regression + coverage
  ${{ if eq(variables['Build.Reason'], 'PullRequest') }}:
    seleniumCategory: "smoke"
    coverageArgs: ""
  ${{ else }}:
    seleniumCategory: "regression"
    coverageArgs: '--collect "XPlat Code Coverage"'

stages:
  - stage: BuildAndValidate
    displayName: "PR Validation and Quality Gate"
    jobs:
      - job: Tests
        displayName: "API, Playwright and Selenium Suites (Linux)"
        pool:
          vmImage: "ubuntu-latest"
        timeoutInMinutes: 30
        steps:
          - checkout: self
            fetchDepth: 1

          - task: UseDotNet@2
            displayName: "Setup .NET SDK 10.x"
            inputs:
              packageType: "sdk"
              version: "10.x"

          # build restores implicitly; one call is faster than restore + build
          - script: dotnet build ci.slnf --configuration $(buildConfiguration)
            displayName: "Build CI Projects (Release)"

          - script: dotnet test API/API.Tests.csproj --configuration $(buildConfiguration) --no-build --logger "trx;LogFileName=api_results.trx" $(coverageArgs)
            displayName: "Run API Test Suite"

          - script: dotnet test tests/Automation.Tests/Automation.Tests.csproj --configuration $(buildConfiguration) --no-build --logger "trx;LogFileName=web_results.trx" $(coverageArgs)
            displayName: "Run Playwright Web Suite"
            condition: succeededOrFailed()

          # CI runs the Chrome test cases only (DisplayName~chrome); Firefox and Edge
          # cases still run locally (scripts/*/run_ui_web_all_browsers).
          # Selenium Manager downloads chromedriver. BaseWebTest forces headless
          # mode because Azure sets TF_BUILD=True.
          - script: dotnet test UI/Web/UI.Web.Tests.csproj --configuration $(buildConfiguration) --no-build --filter "Category=$(seleniumCategory)&DisplayName~chrome" --logger "trx;LogFileName=selenium_results.trx"
            displayName: "Run Selenium Web Suite ($(seleniumCategory))"
            condition: succeededOrFailed()

          - task: PublishTestResults@2
            displayName: "Publish Test Results"
            condition: always()
            inputs:
              testResultsFormat: "VSTest"
              testResultsFiles: "**/*_results.trx"
              searchFolder: "$(System.DefaultWorkingDirectory)"
              testRunTitle: "API + Playwright + Selenium"
              failTaskOnFailedTests: true

          - task: PublishCodeCoverageResults@2
            displayName: "Publish Code Coverage"
            condition: and(always(), eq(variables.isPullRequest, false))
            inputs:
              summaryFileLocation: "$(System.DefaultWorkingDirectory)/**/coverage.cobertura.xml"

          # Allure result files have unique names, so the suites' folders merge into one.
          - script: |
              out="$(Build.ArtifactStagingDirectory)/allure-results"
              mkdir -p "$out"
              for d in API tests/Automation.Tests UI/Web; do
                src="$d/bin/$(buildConfiguration)/net10.0/allure-results"
                [ -d "$src" ] && cp -R "$src"/. "$out"/
              done
              cp allure-categories.json "$out/categories.json"
              echo "Allure result files: $(ls "$out" | grep -c 'result.json')"
            displayName: "Merge Allure Results"
            condition: always()

          - task: PublishPipelineArtifact@1
            displayName: "Upload Allure Results"
            condition: always()
            continueOnError: true
            inputs:
              targetPath: "$(Build.ArtifactStagingDirectory)/allure-results"
              artifact: "allure-results"
